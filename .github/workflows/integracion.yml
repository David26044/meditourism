name: Pruebas de integración

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  integracion:
    name: pruebas-de-integracion
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - run: ./mvnw -B verify
